services:
  app:
    build: .
    env_file: .env
    # Les pieces de candidature (etape 8) vivent dans storage/app/private, hors
    # de public/ et sans URL. Ce volume est ce qui les rend durables : sans lui,
    # une reconstruction de l'image emporterait les dossiers deja deposes.
    volumes:
      - documents_data:/var/www/html/storage/app/private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # PHP-FPM n'expose pas d'URL : la sonde ouvre son port, ce qui prouve qu'il
    # ecoute vraiment. Aucun paquet supplementaire (l'image n'a ni curl ni
    # wget), aucune authentification, aucune requete metier.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [birnin]

  caddy:
    build:
      context: .
      dockerfile: infrastructure/caddy/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [birnin]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-birnin_gobe}
      POSTGRES_USER: ${DB_USERNAME:-birnin_gobe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-birnin_gobe} -d ${DB_DATABASE:-birnin_gobe}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [birnin]

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [birnin]

  worker:
    build: .
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=120
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [birnin]

  scheduler:
    build: .
    command: php artisan schedule:work
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [birnin]

  # Stockage objet et antivirus : l'architecture les prevoit pour les pieces
  # jointes, mais aucun code ne les appelle encore — `grep -r "Storage::"` ne
  # rend rien. Ils passent donc derriere un profil : ils ne demarrent plus avec
  # `docker compose up -d`, et reviennent avec `--profile fichiers` le jour ou
  # l'etape « Pieces » les utilisera. Demarrer aujourd'hui un antivirus qui
  # telecharge ses signatures et occupe un Go de memoire pour rien serait payer
  # d'avance une fonctionnalite absente.
  minio:
    profiles: [fichiers]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-birnin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-change-me}
    ports:
      - "9001:9001"
    volumes: [minio_data:/data]
    networks: [birnin]

  clamav:
    profiles: [fichiers]
    image: clamav/clamav:stable
    volumes: [clamav_data:/var/lib/clamav]
    networks: [birnin]

networks:
  birnin: {}

volumes:
  documents_data: {}
  postgres_data: {}
  redis_data: {}
  minio_data: {}
  clamav_data: {}
  caddy_data: {}
  caddy_config: {}
