name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # Les tests d'authentification écrivent réellement en base : PostgreSQL est
    # démarré comme service, pas simulé.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: birnin_gobe_test
          POSTGRES_USER: birnin_gobe
          POSTGRES_PASSWORD: secret-de-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U birnin_gobe -d birnin_gobe_test"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, bcmath
      - uses: ramsey/composer-install@v3

      - name: Style de code
        run: vendor/bin/pint --test app/Console app/Domain app/Http app/Models app/Policies app/Providers database/factories database/seeders tests/Feature

      - name: Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: birnin_gobe_test
          DB_USERNAME: birnin_gobe
          DB_PASSWORD: secret-de-ci
        run: vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # `npm ci` installe exactement le verrou, là où `npm install` peut le
      # contourner — même exigence que le Dockerfile.
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
